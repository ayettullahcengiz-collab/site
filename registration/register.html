<div class="tl_popup_container tl_popup_container_register" style="max-width: 480px; margin: 0 auto; background: #131703; padding: 25px 30px; border: 1px solid #2B350B; border-radius: 6px; box-shadow: 0 10px 40px rgba(0,0,0,0.8); position: relative; font-family: Roboto, sans-serif;">
    <button type="button" class="tl_popup_close_btn" onclick="$('#registerContent').dialog('close');" style="position: absolute; top: 12px; right: 15px; background: none; border: none; color: #fff; font-size: 24px; cursor: pointer; line-height: 1;">&times;</button>
    <div style="text-align: center; margin-bottom: 20px;">
        <img src="/plat/prd/Img/partners/1093/logo_big.gif" alt="Grandpashabet" style="max-width: 200px; height: auto;" onerror="this.src='/plat/prd/Img/partners/1093/FF.png'">
        <h3 style="color: #D0B752; margin-top: 10px; font-size: 18px; text-transform: uppercase;">Hesap Oluştur</h3>
    </div>
    <form id="dynamic_register_form" onsubmit="event.preventDefault(); alert('Kayıt başarılı!');">
        <div class="dyn_login_form_group" style="display: flex; margin-bottom: 12px; width: 100%;">
            <label class="dyn_login_label" style="width: 110px; background-color: #D0B752; color: #000; font-weight: bold; font-size: 13px; display: flex; align-items: center; justify-content: center; height: 40px; margin: 0; text-transform: uppercase;">Kullanıcı Adı</label>
            <input type="text" class="dyn_login_input" name="reg_username" required style="flex: 1; background-color: #2B350B; border: 1px solid #3c4912; color: #fff; padding: 0 12px; font-size: 14px; height: 40px; outline: none;">
        </div>
        <div class="dyn_login_form_group" style="display: flex; margin-bottom: 12px; width: 100%;">
            <label class="dyn_login_label" style="width: 110px; background-color: #D0B752; color: #000; font-weight: bold; font-size: 13px; display: flex; align-items: center; justify-content: center; height: 40px; margin: 0; text-transform: uppercase;">E-Posta</label>
            <input type="email" class="dyn_login_input" name="reg_email" required style="flex: 1; background-color: #2B350B; border: 1px solid #3c4912; color: #fff; padding: 0 12px; font-size: 14px; height: 40px; outline: none;">
        </div>
        <div class="dyn_login_form_group" style="display: flex; margin-bottom: 12px; width: 100%;">
            <label class="dyn_login_label" style="width: 110px; background-color: #D0B752; color: #000; font-weight: bold; font-size: 13px; display: flex; align-items: center; justify-content: center; height: 40px; margin: 0; text-transform: uppercase;">Telefon</label>
            <input type="tel" class="dyn_login_input" name="reg_phone" placeholder="+90 5xx xxx xx xx" required style="flex: 1; background-color: #2B350B; border: 1px solid #3c4912; color: #fff; padding: 0 12px; font-size: 14px; height: 40px; outline: none;">
        </div>
        <div class="dyn_login_form_group" style="display: flex; margin-bottom: 15px; width: 100%;">
            <label class="dyn_login_label" style="width: 110px; background-color: #D0B752; color: #000; font-weight: bold; font-size: 13px; display: flex; align-items: center; justify-content: center; height: 40px; margin: 0; text-transform: uppercase;">Şifre</label>
            <input type="password" class="dyn_login_input" name="reg_password" required style="flex: 1; background-color: #2B350B; border: 1px solid #3c4912; color: #fff; padding: 0 12px; font-size: 14px; height: 40px; outline: none;">
        </div>
        <div style="margin-bottom: 18px; font-size: 12px; color: #B8B8B8;">
            <label style="display: flex; align-items: flex-start; gap: 8px; cursor: pointer;">
                <input type="checkbox" required checked style="accent-color: #D0B752; margin-top: 2px;">
                <span>18 yaşından büyük olduğumu ve şartları kabul ettiğimi onaylıyorum.</span>
            </label>
        </div>
        <div style="text-align: center; margin-bottom: 15px;">
            <button type="submit" class="tl_btn" style="width: 100%; height: 44px; background: #D0B752; color: #000; font-weight: bold; font-size: 17px; border: none; cursor: pointer; text-transform: uppercase; border-radius: 3px;">KAYIT OL</button>
        </div>
        <div style="text-align: center; font-size: 13px; color: #B8B8B8;">
            Zaten hesabınız var mı? <a href="#" onclick="$('#registerContent').dialog('close'); $('.loginDialog').first().trigger('click'); return false;" style="color: #D0B752; font-weight: bold; text-decoration: none;">Giriş Yap</a>
        </div>
    </form>
</div>
