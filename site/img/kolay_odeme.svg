<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 52" fill="none">
  <!-- Kolay Ödeme Icon -->
  <g transform="translate(6, 4)">
    <!-- Folded bill / invoice top right -->
    <path d="M12 28 L18 10 C18.8 7.6 21 6 23.5 6 L33 6 C35.5 6 37.5 7.8 37.8 10.3 L39.5 24 C36.5 21.5 32.5 20 28 20 C20.5 20 14.2 24.2 12 28 Z" fill="#00b050"/>
    <!-- Stripes / bill details -->
    <path d="M22 11 L31 11" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M21 15 L29 15" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M20 19 L26 19" stroke="#ffffff" stroke-width="1.8" stroke-linecap="round"/>
    
    <!-- Outer accent / shield -->
    <path d="M6 25 C6 25 11 15 22 13 L23 18 C15 19 11 26 10 32 Z" fill="#008a3e" opacity="0.6"/>

    <!-- Blue circle with checkmark -->
    <circle cx="19" cy="30" r="14" fill="#0056b3"/>
    <!-- Circular gloss ring -->
    <circle cx="19" cy="30" r="12.5" stroke="#1a73e8" stroke-width="1" fill="none" opacity="0.5"/>
    <!-- White checkmark -->
    <path d="M13.5 30 L17.5 34 L25 25" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Typography -->
  <g transform="translate(56, 12)">
    <text x="0" y="14" font-family="'Montserrat', 'Roboto', 'Segoe UI', -apple-system, sans-serif" font-weight="900" font-size="16" fill="#009640" letter-spacing="0.5">KOLAY</text>
    <text x="0" y="30" font-family="'Montserrat', 'Roboto', 'Segoe UI', -apple-system, sans-serif" font-weight="800" font-size="14.5" fill="#0056b3" letter-spacing="0.3">ÖDEME</text>
  </g>
</svg>
